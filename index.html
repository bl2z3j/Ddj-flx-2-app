<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDJ-FLX2 Hot Cues Visualizer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ff3366;
            margin-bottom: 5px;
        }
        #status {
            color: #ffa500;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .pads-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        .pad {
            aspect-ratio: 1;
            background: #222;
            border: 2px solid #444;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            transition: all 0.1s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .pad.active {
            background: #00ffcc;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 20px #00ffcc;
            transform: scale(0.95);
        }
        #message-box {
            font-size: 1.2rem;
            color: #ff3366;
            height: 30px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>DDJ-FLX2 Hot Cue Visualizer</h1>
    <div id="status">Status: Oczekiwanie na połączenie...</div>

    <div class="pads-container">
        <div class="pad" id="pad-1">HOT CUE 1</div>
        <div class="pad" id="pad-2">HOT CUE 2</div>
        <div class="pad" id="pad-3">HOT CUE 3</div>
        <div class="pad" id="pad-4">HOT CUE 4</div>
    </div>

    <div id="message-box">Naciśnij Pad na DDJ-FLX2!</div>

<script>
    const statusDiv = document.getElementById('status');
    const messageBox = document.getElementById('message-box');

    // Podłączenie pod Web MIDI API
    if (navigator.requestMIDIAccess) {
        navigator.requestMIDIAccess().then(onMIDISuccess, onMIDIFailure);
    } else {
        statusDiv.textContent = "Brak obsługi Web MIDI. Użyj przeglądarki ze wsparciem WebMIDI!";
    }

    function onMIDISuccess(midiAccess) {
        statusDiv.textContent = "Połączono z systemem MIDI!";
        statusDiv.style.color = "#00ffcc";

        for (let input of midiAccess.inputs.values()) {
            input.onmidimessage = handleMIDIMessage;
            statusDiv.textContent = `Urządzenie: ${input.name}`;
        }
    }

    function onMIDIFailure() {
        statusDiv.textContent = "Błąd dostępu do urządzeń MIDI!";
        statusDiv.style.color = "#ff4444";
    }

    function handleMIDIMessage(event) {
        const [command, note, velocity] = event.data;

        // W MIDI Wrench widziałeś [Note On] oraz wartości nuty (note)
        // Domyślny stan wciśnięcia przycisku zwykle wysyła velocity > 0 lub command = 144..159
        const isPressed = velocity > 0;

        // Tutaj wpisujemy numery nut odpowiadające Padowi 1, 2, 3, 4 w Twoim DDJ-FLX2
        // Mapowanie nut zależy od decka i trybu padów (np. nuty 0, 1, 2, 3 lub 36, 37, 38, 39)
        let padElement = null;

        if (note === 0 || note === 36 || note === 54) { 
            padElement = document.getElementById('pad-1');
        } else if (note === 1 || note === 37 || note === 55) {
            padElement = document.getElementById('pad-2');
        } else if (note === 2 || note === 38 || note === 56) {
            padElement = document.getElementById('pad-3');
        } else if (note === 3 || note === 39 || note === 57) {
            padElement = document.getElementById('pad-4');
        }

        if (padElement) {
            if (isPressed) {
                padElement.classList.add('active');
                messageBox.textContent = `Wciśnięto: ${padElement.textContent}!`;
            } else {
                padElement.classList.remove('active');
                messageBox.textContent = "Zwolniono przycisk";
            }
        } else {
            messageBox.textContent = `Odebrano Nuta: ${note}, Szybkość: ${velocity}`;
        }
    }
</script>

</body>
</html>
